
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Vishal Rathod | Product Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=Manrope:wght@400;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Manrope', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              charcoal: {
                950: '#050505',
                900: '#0d0d0d', 
                800: '#121212',
                700: '#1c1c1c',
              },
              paper: {
                50: '#ffffff',
                100: '#fafafa',
                200: '#F2F4F7',
                300: '#E4E7EC',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Ultra-smooth root font transition with hardware acceleration */
      html {
        position: relative;
        /* CRITICAL: Removed scroll-behavior: smooth to prevent conflict with GSAP */
        transition: font-size 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: font-size;
        -webkit-text-size-adjust: 100%;
      }
      body {
        overflow-x: hidden;
        width: 100vw;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #555;
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-track {
        background: #0d0d0d;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #333;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Loader Styles */
      #loader {
          position: fixed; width: 100%; height: 100%; background: #0d0d0d;
          display: flex; flex-direction: column; justify-content: center; align-items: center;
          z-index: 9999; transition: opacity 0.8s ease;
      }
      .shield-logo {
          width: 60px; height: 70px; border: 3px solid #4f46e5;
          border-radius: 5px 5px 30px 30px; position: relative;
          animation: pulse-3d 2s infinite ease-in-out;
      }
      .inner-shield {
          position: absolute; top: 10px; left: 10px; width: 34px; height: 40px;
          background: #4f46e5; border-radius: 2px 2px 20px 20px; opacity: 0.5;
      }
      @keyframes pulse-3d {
          0%, 100% { transform: scale(1) rotateY(0deg); opacity: 0.8; }
          50% { transform: scale(1.1) rotateY(180deg); opacity: 1; box-shadow: 0 0 30px #4f46e5; }
      }
      .loading-text { margin-top: 20px; font-size: 10px; letter-spacing: 4px; color: #4f46e5; font-family: 'Manrope', sans-serif; font-weight: 700; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react,react-dom",
    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.16?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.99.0?external=react,react-dom,three,@react-three/fiber",
    "gsap": "https://esm.sh/gsap@3.12.5",
    "gsap/ScrollTrigger": "https://esm.sh/gsap@3.12.5/ScrollTrigger",
    "gsap/ScrollToPlugin": "https://esm.sh/gsap@3.12.5/ScrollToPlugin",
    "gsap/": "https://esm.sh/gsap@^3.14.2/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CBN12W65CZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-CBN12W65CZ');
  </script>
  <script>
    // Track clicks on case study links
    document.addEventListener('DOMContentLoaded', function() {
      // Track all links that go to case studies
      const caseStudyLinks = document.querySelectorAll('a[href*="lovable.app"], a[href*="figma.site"], a[href*="vercel.app"]');
      
      caseStudyLinks.forEach(function(link) {
        link.addEventListener('click', function() {
          gtag('event', 'click_case_study', {
            'case_study_name': link.textContent.trim(),
            'case_study_url': link.href
          });
        });
      });
    });
  </script>
</head>
  <body class="bg-paper-200 text-charcoal-900 dark:bg-charcoal-900 dark:text-white transition-colors duration-500 relative">
    <div id="loader">
        <div class="shield-logo">
            <div class="inner-shield"></div>
        </div>
        <p class="loading-text">INITIALIZING PRECISION...</p>
    </div>
    <div id="root" class="relative"></div>
    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            setTimeout(() => {
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 800);
                }
            }, 1500); 
        });
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
