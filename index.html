
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Vishal Rathod | Product Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              serif: ['Cormorant Garamond', 'serif'],
            },
            colors: {
              charcoal: {
                950: '#020202',
                900: '#080808', 
                800: '#111111',
                700: '#1a1a1a',
              },
              accent: {
                blue: '#2563eb',
                green: '#10b981',
                orange: '#f97316',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* 2026 System Aesthetic */
      html {
        position: relative;
        transition: background-color 0.5s ease;
        -webkit-text-size-adjust: 100%;
        scroll-behavior: auto; /* GSAP handles smoothing */
      }
      body {
        overflow-x: hidden;
        width: 100vw;
        background-color: #080808; /* Default dark */
        color: #ffffff;
      }
      
      /* Custom Scrollbar - Industrial */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #020202;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 0;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #2563eb;
      }

      /* Grid Background */
      .system-grid {
        background-image: 
          linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 40px 40px;
      }
      
      /* Loader - System Boot */
      #loader {
          position: fixed; inset: 0; background: #020202;
          display: flex; flex-direction: column; justify-content: center; align-items: center;
          z-index: 9999;
      }
      .boot-line {
        width: 200px; height: 1px; background: #333; position: relative; overflow: hidden;
      }
      .boot-progress {
        position: absolute; left: 0; top: 0; height: 100%; background: #2563eb;
        width: 0%; animation: boot 1.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      @keyframes boot {
        0% { width: 0%; }
        100% { width: 100%; }
      }
      .boot-text { 
        margin-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; 
        color: #666; text-transform: uppercase; letter-spacing: 2px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react,react-dom",
    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.16?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.99.0?external=react,react-dom,three,@react-three/fiber",
    "gsap": "https://esm.sh/gsap@3.12.5",
    "gsap/ScrollTrigger": "https://esm.sh/gsap@3.12.5/ScrollTrigger",
    "gsap/ScrollToPlugin": "https://esm.sh/gsap@3.12.5/ScrollToPlugin",
    "gsap/": "https://esm.sh/gsap@^3.14.2/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-charcoal-900 text-white relative">
    <div id="loader">
        <div class="boot-line">
            <div class="boot-progress"></div>
        </div>
        <p class="boot-text">System Initialization...</p>
    </div>
    <div id="root" class="relative"></div>
    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            setTimeout(() => {
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 800);
                }
            }, 1500); 
        });
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
